version: '3.8'

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - betmate-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - betmate-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=betmate
      - POSTGRES_USER=bot_readonly
      - POSTGRES_PASSWORD=bot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - betmate-network

  backend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend:/app
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/betmate
      - MICROSERVICE_URL=http://microservice:8000/dev
      - MICROSERVICE_API_KEY=local-microservice-key
    ports:
      - "9000:9000"
    depends_on:
      - mongo
      - microservice
    networks:
      - betmate-network

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development
      - TARGET_ENV=dev
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - betmate-network

  microservice:
    build:
      context: ./microservice/src/router
    depends_on:
      - wdl-container
      - top-moves-container
      - move-analysis-container
    environment:
      - HOST_URL=router-internal
    ports:
      - "8000:8000"
    networks:
      - betmate-network

  wdl-container:
    build:
      context: ./microservice/src/lambdas/wdl
    environment:
      - LOCAL_DEV=true
      - TIME_LIMIT=1.0
      - HASH_SIZE=128
      - STOCKFISH_PATH=/var/task/assets/stockfish_linux
      # Optional LC0 (Leela) integration. Provide lc0 binary + weights in ./microservice/assets
      # and set ENGINE_PROVIDER=lc0 to enable blending with time tables.
      - ENGINE_PROVIDER=${ENGINE_PROVIDER:-stockfish}
      - LILA_ENGINE_PATH=${LILA_ENGINE_PATH:-/var/task/assets/lc0}
      - LILA_WEIGHTS_PATH=${LILA_WEIGHTS_PATH:-/var/task/assets/weights.pb}
      - LILA_BACKEND=${LILA_BACKEND:-blas}
      - ENABLE_ENGINE_WDL_BLEND=${ENABLE_ENGINE_WDL_BLEND:-true}
      - ENGINE_WDL_BASE_WEIGHT=${ENGINE_WDL_BASE_WEIGHT:-0.6}
      - ENGINE_WDL_MAX_WEIGHT=${ENGINE_WDL_MAX_WEIGHT:-0.9}
    volumes:
      - ./microservice/assets:/var/task/assets
    networks:
      - betmate-network

  top-moves-container:
    build:
      context: ./microservice/src/lambdas/top_moves
    environment:
      - LOCAL_DEV=true
      - DEPTH=6
      - HASH_SIZE=128
      - STOCKFISH_PATH=/var/task/assets/stockfish_linux
    networks:
      - betmate-network

  move-analysis-container:
    build:
      context: ./microservice/src/lambdas/move_analysis
    environment:
      - LOCAL_DEV=true
      - DEPTH=6
      - HASH_SIZE=64
      - STOCKFISH_PATH=/var/task/assets/stockfish_linux
    volumes:
      - ./microservice/assets:/var/task/assets
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    networks:
      - betmate-network

networks:
  betmate-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  postgres-data:
